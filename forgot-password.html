<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest | Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="forgot-wrapper">

    <div class="forgot-card">

        <a href="index.html" class="back-link">
            ← Back to Login
        </a>

        <div class="client-logo">
            ABC
        </div>

        <h2>ABC Ltd.</h2>

        <p class="portal-title">
            Payroll Administration Portal
        </p>

        <h3>Forgot Password?</h3>

        <p class="forgot-text">
            Enter your username and registered email address to receive a password reset link.
        </p>

        <div class="field">

            <label>Username</label>

            <input
                type="text"
                id="forgotUsername"
                placeholder="Enter username">

        </div>

        <div class="field">

            <label>Registered Email</label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter registered email">

        </div>

        <button
            type="button"
            class="login-btn"
            onclick="sendResetLink()">

            Send Reset Link

        </button>

        <div class="powered-by">

            <div class="logo-row">

                <div class="mini-logo">
                    🪺₹
                </div>

                <span>
                    Powered by PayNest
                </span>

            </div>

            <div class="copyright">

                © 2026 PayNest Technologies.
                All rights reserved.

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
