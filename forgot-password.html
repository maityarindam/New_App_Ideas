<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="forgot-wrapper">

    <div class="forgot-card">

        <a href="../index.html"
           class="back-link">

           ← Back to Login

        </a>

        <img src="../assets/logos/abc-logo.svg"
             class="client-logo">

        <h2>ABC Ltd.</h2>

        <p class="portal-title">
            Payroll Administration Portal
        </p>

        <h3>Forgot Password?</h3>

        <p class="forgot-text">

            Enter your username and
            registered email address.

        </p>

        <div class="field">

            <label>Username</label>

            <input
                type="text"
                placeholder="Enter username">

        </div>

        <div class="field">

            <label>Registered Email</label>

            <input
                type="email"
                placeholder="Enter registered email">

        </div>

        <button class="login-btn">

            Send Reset Link

        </button>

        <div class="powered-by">

            <div class="logo-row">

                <img src="../assets/logos/paynest-logo.svg"
                     class="paynest-logo">

                <span>Powered by PayNest</span>

            </div>

            <div class="copyright">

                © 2026 PayNest Technologies.
                All rights reserved.

            </div>

        </div>

    </div>

</div>

</body>
</html>
