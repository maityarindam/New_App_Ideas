<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="left-panel">

        <div class="illustration-card">

            <div class="paynest-big-logo">
                🪺₹
            </div>

            <h1>PayNest</h1>

            <p class="tagline">
                Nest Your Workforce
            </p>

            <div class="feature-list">

                <div>✓ Employee Management</div>
                <div>✓ Payroll Processing</div>
                <div>✓ Salary Registers</div>
                <div>✓ Reports & Analytics</div>
                <div>✓ Compliance & Security</div>

            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="login-card">

            <div class="client-logo">
                ABC
            </div>

            <h2>ABC Ltd.</h2>

            <p class="portal-title">
                Payroll Administration Portal
            </p>

            <form id="loginForm">

                <div class="field">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username">

                    <small
                        id="usernameError"
                        class="error">
                    </small>

                </div>

                <div class="field">

                    <label>Password</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password">

                        <button
                            type="button"
                            class="eye-btn"
                            onclick="togglePassword()">

                            👁

                        </button>

                    </div>

                    <small
                        id="passwordError"
                        class="error">
                    </small>

                </div>

                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    Sign In

                </button>

            </form>

            <div class="powered-by">

                <div class="logo-row">

                    <div class="mini-logo">
                        🪺₹
                    </div>

                    <span>
                        Powered by PayNest
                    </span>

                </div>

                <div class="copyright">

                    © 2026 PayNest Technologies.
                    All rights reserved.

                </div>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
