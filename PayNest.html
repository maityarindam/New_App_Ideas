<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest - Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:#F8FAFC;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-container{
            width:100%;
            max-width:420px;
            background:#ffffff;
            padding:40px;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo-icon{
            width:60px;
            height:60px;
            background:#2563EB;
            color:white;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 15px;
            font-size:28px;
            font-weight:bold;
        }

        .logo h1{
            color:#0F172A;
            font-size:30px;
            margin-bottom:5px;
        }

        .logo p{
            color:#64748B;
            font-size:14px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#334155;
            font-weight:500;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #CBD5E1;
            border-radius:10px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#2563EB;
        }

        .password-wrapper{
            position:relative;
        }

        .show-password{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#64748B;
            font-size:14px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:25px;
        }

        .remember input{
            width:auto;
        }

        .login-btn{
            width:100%;
            background:#2563EB;
            color:white;
            border:none;
            padding:15px;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#1D4ED8;
        }

        .footer{
            text-align:center;
            margin-top:25px;
            color:#94A3B8;
            font-size:13px;
        }

        @media(max-width:480px){

            .login-container{
                padding:25px;
            }

            .logo h1{
                font-size:26px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">P</div>
        <h1>PayNest</h1>
        <p>Payroll Made Simple</p>
    </div>

    <form>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Password</label>

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password">
                <span class="show-password" onclick="togglePassword()">Show</span>
            </div>
        </div>

        <div class="remember">
            <input type="checkbox">
            <span>Remember Me</span>
        </div>

        <button type="button" class="login-btn" onclick="login()">
            Login
        </button>

    </form>

    <div class="footer">
        © 2026 PayNest Technologies
    </div>

</div>

<script>

function togglePassword(){

    const password = document.getElementById('password');

    if(password.type === 'password'){
        password.type = 'text';
    }else{
        password.type = 'password';
    }
}

function login(){
    alert('Login functionality will be added later.');
}

</script>

</body>
</html>
