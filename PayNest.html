<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayNest | Login</title>

<style>

:root{
    --primary:#EA580C;
    --primary-hover:#C2410C;
    --accent:#F59E0B;
    --text:#1F2937;
    --border:#E7E5E4;
    --bg:#FFFDF8;
    --white:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(
        135deg,
        #EA580C,
        #F59E0B
    );
}

.login-card{
    width:100%;
    max-width:440px;
    background:var(--white);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,0.15);
}

.card-body{
    padding:40px;
}

.client-logo{
    width:90px;
    height:90px;
    margin:auto;
    border:2px dashed var(--border);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6B7280;
    font-size:12px;
    text-align:center;
    padding:10px;
}

.company-name{
    margin-top:18px;
    text-align:center;
    color:var(--text);
    font-size:24px;
    font-weight:700;
}

.portal-title{
    text-align:center;
    color:#6B7280;
    margin-top:8px;
    margin-bottom:35px;
    font-size:14px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:var(--text);
    font-size:14px;
    font-weight:600;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:var(--primary);
}

.password-wrapper{
    position:relative;
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:10px;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    font-size:14px;
}

.forgot-password{
    color:var(--primary);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.forgot-password:hover{
    color:var(--primary-hover);
}

.login-btn{
    width:100%;
    border:none;
    background:var(--primary);
    color:white;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    transition:.3s;
}

.login-btn:hover{
    background:var(--primary-hover);
}

.footer{
    background:#FFF8F1;
    border-top:1px solid var(--border);
    text-align:center;
    padding:25px;
}

.powered-by{
    color:#6B7280;
    font-size:12px;
    margin-bottom:12px;
}

.paynest-logo{
    width:50px;
    height:50px;
    margin:auto;
    background:var(--primary);
    color:white;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
}

.paynest-name{
    margin-top:10px;
    color:var(--text);
    font-size:18px;
    font-weight:700;
}

.tagline{
    margin-top:5px;
    color:#6B7280;
    font-size:13px;
}

.version{
    margin-top:15px;
    color:#9CA3AF;
    font-size:12px;
}

@media(max-width:480px){

    .card-body{
        padding:25px;
    }

    .company-name{
        font-size:20px;
    }

    .options{
        flex-direction:column;
        align-items:flex-start;
    }
}

</style>
</head>

<body>

<div class="login-card">

    <div class="card-body">

        <div class="client-logo">
            CLIENT<br>LOGO
        </div>

        <div class="company-name">
            Company Name
        </div>

        <div class="portal-title">
            Payroll Administration
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label>Password</label>

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password">
                <span class="eye" onclick="togglePassword()">👁</span>
            </div>
        </div>

        <div class="options">

            <label class="remember">
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#" class="forgot-password">
                Forgot Password?
            </a>

        </div>

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

    </div>

    <div class="footer">

        <div class="powered-by">
            Powered by
        </div>

        <div class="paynest-logo">
            P
        </div>

        <div class="paynest-name">
            PayNest
        </div>

        <div class="tagline">
            Nest Your Workforce
        </div>

        <div class="version">
            Version 1.0.0
        </div>

    </div>

</div>

<script>

function togglePassword(){

    const password =
        document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }else{
        password.type = "password";
    }
}

function login(){
    alert("Dashboard integration coming next.");
}

</script>

</body>
</html>
