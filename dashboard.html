<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PayNest Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <img src="assets/logo.png" alt="Logo" height="30">
  </div>

  <div class="menu">Modules</div>

  <div class="search">
    <input type="text" placeholder="Search employees...">
  </div>

  <div class="right-icons">
    🔔 👤 ⚙️
  </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <ul>
    <li>Dashboard</li>
    <li>Employees</li>
    <li>Payroll</li>
    <li>Reports</li>
    <li>Analytics</li>
    <li>Settings</li>
  </ul>
</aside>

<!-- MAIN -->
<main class="main">

  <h2>Dashboard</h2>

  <!-- KPI ROW -->
  <div class="kpi-grid">
    <div class="card">Total Employees<br><b>120</b></div>
    <div class="card">Active<br><b>110</b></div>
    <div class="card">Left<br><b>10</b></div>
    <div class="card">New<br><b>5</b></div>
  </div>

  <!-- WIDGET GRID -->
  <div class="widget-grid">

    <div class="widget">Employee Growth Chart</div>
    <div class="widget">Gender Distribution</div>
    <div class="widget">Age Distribution</div>
    <div class="widget">Years of Service</div>

  </div>

</main>

<!-- FOOTER -->
<footer class="footer">
  © 2026 PayNest | v1.0.0
</footer>

<script src="app.js"></script>
</body>
</html>
