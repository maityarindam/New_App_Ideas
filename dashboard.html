<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayNest | Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-logo">
            🪺
        </div>

        <div class="menu">

            <div class="menu-item active">🏠</div>
            <div class="menu-item">👥</div>
            <div class="menu-item">💰</div>
            <div class="menu-item">📊</div>
            <div class="menu-item">⚙️</div>

        </div>

    </div>

    <!-- MAIN AREA -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="search">
                <input type="text" placeholder="Search employees, reports...">
            </div>

            <div class="topbar-right">

                <div class="icon">🔔</div>
                <div class="icon">⚙️</div>

                <div class="user" onclick="logout()" style="cursor:pointer">

    <div class="avatar">A</div>

    <span>Logout</span>

</div>

            </div>

        </div>

        <!-- WELCOME -->
        <div class="welcome">

            <h2>Good Morning, Arindam 👋</h2>
            <p>“Success is the sum of small efforts repeated daily.”</p>

        </div>

        <!-- WIDGET GRID -->
        <div class="grid">

            <div class="card">
                <h3>Employee Growth</h3>
                <canvas id="chart1"></canvas>
            </div>

            <div class="card">
                <h3>Gender Distribution</h3>
                <canvas id="chart2"></canvas>
            </div>

            <div class="card">
                <h3>Age Distribution</h3>
                <canvas id="chart3"></canvas>
            </div>

            <div class="card">
                <h3>Employee Count</h3>
                <canvas id="chart4"></canvas>
            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
